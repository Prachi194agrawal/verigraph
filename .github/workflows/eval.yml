name: eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Unit + Neo4j integration tests, then the offline smoke gate (fixture repo + mock model).
  tests:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/verigraph-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p verigraph-password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: verigraph-password
      EMBEDDING_MODEL: hash
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q
      - name: Smoke gate (offline)
        run: verigraph gate --config ../evals/gate.smoke.yaml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  changes:
    runs-on: ubuntu-latest
    outputs:
      eval: ${{ steps.filter.outputs.eval }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            eval:
              - 'backend/app/llm/prompts/**'
              - 'backend/app/pipelines/**'
              - 'backend/app/eval/**'
              - 'evals/**'

  # The regression gate from the plan: rerun the frozen 50-question slice when prompts or pipelines change.
  eval-gate:
    needs: [tests, changes]
    if: needs.changes.outputs.eval == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/verigraph-password
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p verigraph-password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: verigraph-password
      EMBEDDING_MODEL: hash
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Skip without a model API key
        if: env.GROQ_API_KEY == ''
        run: echo "::notice::GROQ_API_KEY secret is not set (or this is a fork); skipping the real eval gate."
      - uses: actions/setup-python@v5
        if: env.GROQ_API_KEY != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - if: env.GROQ_API_KEY != ''
        run: pip install -e ".[dev]"
      - name: Eval gate (psf/requests slice)
        if: env.GROQ_API_KEY != ''
        run: verigraph gate --config ../evals/gate.yaml
      - uses: actions/upload-artifact@v4
        if: always() && env.GROQ_API_KEY != ''
        with:
          name: eval-gate-results
          path: evals/results/

name: PR impact review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-impact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Install the trusted base's analyzer, not code proposed by the PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ./backend
      - name: Fetch PR snapshot
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
            git fetch --no-tags origin "$PR_HEAD"
      - name: Analyze without executing target code
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_REPO: ${{ github.repository }}
          EMBEDDING_MODEL: hash
          DATA_DIR: /tmp/verigraph-data
        run: >-
          verigraph pr-review --repo . --base "$PR_BASE" --head "$PR_HEAD"
          --github-repo "$PR_REPO" --markdown impact.md --json-output impact.json
      - uses: actions/upload-artifact@v4
        with:
          name: pr-impact
          path: |
            impact.md
            impact.json
          retention-days: 14

  comment:
    needs: analyze
    # Forks retain the review artifact; their read-only token cannot post comments.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr-impact
          path: review
      - uses: actions/github-script@v7
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- verigraph-pr-impact -->';
            const report = JSON.parse(fs.readFileSync('review/impact.json', 'utf8'));
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const current = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (current.data.head.sha !== process.env.PR_HEAD || report.head_sha !== process.env.PR_HEAD) {
              core.notice('Skipping a superseded review.');
              return;
            }
            const body = marker + '\n' + String(report.markdown).slice(0, 60000);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
